<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Document</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body> 
    <div class="logo">
        <h1>Add New Document</h1>
    </div>

     <!-- Form for Adding a New Document -->
     <form action="/submit-document" method="post" class="add-document-form" id="add-document-form" onsubmit="submitDocument(event)">
        <input type="text" name="title" placeholder="Title of the article" required>
        <textarea name="text" placeholder="Text content of the article" rows="5" required></textarea>
        <input type="url" name="url" placeholder="URL of the article" required>
        <input type="text" name="authors" placeholder="Article authors (comma-separated)" required>
        <input type="datetime-local" name="timestamp" id="timestamp-input" required>
        <input type="text" name="tags" placeholder="Article Tags (comma-separated)" required>
        
        <!-- Submit and Back Buttons -->
        <div class="buttons-container">
            <a href="/" class="back-button">Back</a>
            <button type="submit" class="submit-button">Submit</button>
        </div>
    </form>

    <!-- Success message (hidden by default) -->
    <p id="success-message" style="display:none; color: green;"></p>
    <p id="error-message" style="display:none; color: red;"></p>

    <script src="{{ url_for('static', filename='add_document.js') }}"></script>
</body>

</html>
